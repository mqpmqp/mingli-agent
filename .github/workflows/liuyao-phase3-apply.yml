name: Apply LiuYao Phase 3 payload

on:
  push:
    branches:
      - codex/liuyao-deterministic-gate-v1-20260901
    paths:
      - .phase3/trigger

permissions:
  contents: write

concurrency:
  group: liuyao-phase3-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify and apply one-shot payload
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "codex/liuyao-deterministic-gate-v1-20260901"
          test -f .phase3/trigger || exit 0
          test "$(cat .phase3/trigger)" = "APPLY_LIUYAO_PHASE3_V1"

          echo "b369506663dcf6a92b2a7e306635163e50325753903d84ff05bb25c2930b9526  .phase3/payload.part00" | sha256sum -c -
          echo "e32cc33709723feac2c31a0dc7529478f1c3ab9e2785ac39443c2c6f45591893  .phase3/payload.part01" | sha256sum -c -
          echo "116105e8ca3e4008aecd7400482780f0d2184e54c1996e55c18c19a427ad4f70  .phase3/payload.part02a" | sha256sum -c -
          echo "160f4f48dcf809429dd88b1d39b08620e9187a6935b150db0eb6301f9d19060d  .phase3/payload.part02b" | sha256sum -c -
          echo "3ce5958955088e7902acc68b6e3b4db31cce46ab855cf52b3ae9414c1853f356  .phase3/payload.part02c" | sha256sum -c -
          echo "4f2f01e193e8ec32667bdb9231dc32c85bf62e87a710f1ba9563a8a15cc608ef  .phase3/payload.part02d" | sha256sum -c -
          echo "c775a2958f8f5dde789423124a345c2706a651029014294d949e75469584ed37  .phase3/payload.part03" | sha256sum -c -

          cat .phase3/payload.part* > /tmp/phase3-payload.b64
          echo "b657548b161f2f52cedf8d36662749e431ba7121188083f8a187a8180697df66  /tmp/phase3-payload.b64" | sha256sum -c -
          base64 --decode /tmp/phase3-payload.b64 > /tmp/phase3-payload.tar.gz
          echo "83d7241e624065020d5640ae87d99fa7963ed55f9efb29cf132b45d5e7bcf5b1  /tmp/phase3-payload.tar.gz" | sha256sum -c -

          mkdir -p /tmp/phase3-unpack
          while IFS= read -r entry; do
            case "${entry}" in
              ./|./LIUYAO_ADVANCED_STRUCTURE_V1_REPORT.md|./docs/|./docs/liuyao/|./docs/liuyao/ADVANCED_STRUCTURE_V1.md|./docs/liuyao/README.md|./src/|./src/mingli/|./src/mingli/liuyao/|./src/mingli/liuyao/__init__.py|./src/mingli/liuyao/advanced.py|./src/mingli/liuyao/advanced_benchmark.py|./src/mingli/liuyao/interpretation.py|./src/mingli/liuyao_cli.py|./tests/|./tests/test_liuyao_advanced.py) ;;
              *) echo "unexpected payload path: ${entry}" >&2; exit 1 ;;
            esac
            case "/${entry}/" in
              */../*|*/././*) echo "unsafe payload path: ${entry}" >&2; exit 1 ;;
            esac
          done < <(tar -tzf /tmp/phase3-payload.tar.gz)
          tar -xzf /tmp/phase3-payload.tar.gz -C /tmp/phase3-unpack --no-same-owner --no-same-permissions
          cp -a /tmp/phase3-unpack/. ./

          echo "309d28b7f1f2dadd65743c1e237abe1e1ab18cc233ef3abbeb104d9a9a531fb8  src/mingli/liuyao/advanced.py" | sha256sum -c -
          echo "e3a7ce12a7606e78cf9cf84b1fd84da869c65bff65d1c8bbc78ddb6999d3de30  src/mingli/liuyao/advanced_benchmark.py" | sha256sum -c -
          echo "40c6fd45114c515706c3ebf9851195f0befc48bfacba56acfa251c5a2a36cc34  src/mingli/liuyao/__init__.py" | sha256sum -c -
          echo "aa2b4b72dfd5563510cc1efe2ba4d1cdb1d5c43ec8271232b33bb4c23c1503f1  src/mingli/liuyao_cli.py" | sha256sum -c -
          echo "4ffed8dda078ad04bb81069b0951ba70361342a96b3fc1e8720f002460eeb230  src/mingli/liuyao/interpretation.py" | sha256sum -c -
          echo "8b2002966d3a82beb30a7ca104c27fafdcbf87c34be885260845865b9afc7aba  tests/test_liuyao_advanced.py" | sha256sum -c -
          echo "59005b4081697321cc8524181c5b5df969ac7f82ec752918fcc1498fdf583402  docs/liuyao/ADVANCED_STRUCTURE_V1.md" | sha256sum -c -
          echo "59449c2fb23c5acae83e650f7e8815b3eedc9f7d8507c528e0e7ce0a430a8802  docs/liuyao/README.md" | sha256sum -c -
          echo "9997b328b7ab0f02c7b97e3fb50dc1fefc950ff302d15c01e2da0ebcb780b03b  LIUYAO_ADVANCED_STRUCTURE_V1_REPORT.md" | sha256sum -c -

          rm -f docs/liuyao/.phase2-write-probe
          rm -rf .phase3
          rm -f .github/workflows/liuyao-phase3-apply.yml

          python -m compileall -q src tests
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(liuyao): add advanced structural interpretation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
